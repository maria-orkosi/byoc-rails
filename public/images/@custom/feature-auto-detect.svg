<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d419d7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#908d13" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d419d7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d419d7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d419d7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d419d7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d419d7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg1)"/>
  <rect width="1024" height="1024" fill="url(#centerGlow)"/>

  <!-- Grid background -->
  <g stroke="#d419d7" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="128" x2="1024" y2="128"/>
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="384" x2="1024" y2="384"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="640" x2="1024" y2="640"/>
    <line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="0" y1="896" x2="1024" y2="896"/>
    <line x1="128" y1="0" x2="128" y2="1024"/>
    <line x1="256" y1="0" x2="256" y2="1024"/>
    <line x1="384" y1="0" x2="384" y2="1024"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="640" y1="0" x2="640" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
    <line x1="896" y1="0" x2="896" y2="1024"/>
  </g>
  <!-- Scanning frame -->
  <rect x="212" y="212" width="600" height="600" rx="20" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.25"/>
  <rect x="212" y="212" width="600" height="600" rx="20" fill="url(#scanGrad)" fill-opacity="0.05"/>

  <!-- Corner brackets -->
  <path d="M212 260 L212 212 L260 212" fill="none" stroke="#d419d7" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M812 260 L812 212 L764 212" fill="none" stroke="#d419d7" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M212 764 L212 812 L260 812" fill="none" stroke="#d419d7" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M812 764 L812 812 L764 812" fill="none" stroke="#d419d7" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Scanning beam -->
  <rect x="212" y="460" width="600" height="4" rx="2" fill="url(#scanLine)"/>

  <!-- Repository elements inside frame -->
  <g transform="translate(320, 280)">
    <rect x="0" y="0" width="160" height="16" rx="4" fill="#d419d7" fill-opacity="0.4"/>
    <rect x="0" y="30" width="120" height="12" rx="3" fill="#908d13" fill-opacity="0.35"/>
    <rect x="0" y="56" width="140" height="12" rx="3" fill="#d419d7" fill-opacity="0.3"/>
    <rect x="20" y="84" width="100" height="10" rx="3" fill="#d419d7" fill-opacity="0.35"/>
    <rect x="20" y="108" width="80" height="10" rx="3" fill="#908d13" fill-opacity="0.3"/>
    <rect x="0" y="140" width="160" height="12" rx="3" fill="#d419d7" fill-opacity="0.4"/>
    <rect x="0" y="166" width="90" height="12" rx="3" fill="#908d13" fill-opacity="0.35"/>
  </g>

  <!-- Detection nodes -->
  <g>
    <circle cx="540" cy="320" r="40" fill="none" stroke="#d419d7" stroke-width="2" stroke-opacity="0.3"/>
    <circle cx="540" cy="320" r="20" fill="none" stroke="#908d13" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="540" cy="320" r="8" fill="#d419d7" fill-opacity="0.5"/>
    <circle cx="540" cy="320" r="3" fill="#908d13"/>

    <circle cx="660" cy="380" r="30" fill="none" stroke="#908d13" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="660" cy="380" r="14" fill="none" stroke="#d419d7" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="660" cy="380" r="5" fill="#908d13" fill-opacity="0.5"/>

    <circle cx="580" cy="420" r="25" fill="none" stroke="#d419d7" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="580" cy="420" r="6" fill="#d419d7" fill-opacity="0.4"/>
  </g>

  <!-- Scanning icons across bottom area -->
  <g transform="translate(280, 550)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="none" stroke="#d419d7" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="8" y="8" width="44" height="44" rx="4" fill="#d419d7" fill-opacity="0.08"/>

    <rect x="80" y="0" width="60" height="60" rx="8" fill="none" stroke="#908d13" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="88" y="8" width="44" height="44" rx="4" fill="#908d13" fill-opacity="0.08"/>

    <rect x="160" y="0" width="60" height="60" rx="8" fill="none" stroke="#d419d7" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="168" y="8" width="44" height="44" rx="4" fill="#d419d7" fill-opacity="0.08"/>

    <rect x="240" y="0" width="60" height="60" rx="8" fill="none" stroke="#908d13" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="248" y="8" width="44" height="44" rx="4" fill="#908d13" fill-opacity="0.08"/>

    <rect x="320" y="0" width="60" height="60" rx="8" fill="none" stroke="#d419d7" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="328" y="8" width="44" height="44" rx="4" fill="#d419d7" fill-opacity="0.08"/>
  </g>

  <!-- Checking indicators -->
  <g transform="translate(340, 680)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M-4 0 L-1 3 L5 -3" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="60" cy="0" r="12" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M56 0 L59 3 L65 -3" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="120" cy="0" r="12" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M116 0 L119 3 L125 -3" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="180" cy="0" r="12" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M176 0 L179 3 L185 -3" fill="none" stroke="#908d13" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="240" cy="0" r="12" fill="none" stroke="#d419d7" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="300" cy="0" r="12" fill="none" stroke="#d419d7" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="360" cy="0" r="12" fill="none" stroke="#d419d7" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="900" cy="900" r="160" fill="none" stroke="#d419d7" stroke-width="0.5" stroke-opacity="0.06"/>
  <circle cx="900" cy="900" r="200" fill="none" stroke="#908d13" stroke-width="0.5" stroke-opacity="0.04"/>
  <circle cx="124" cy="124" r="100" fill="none" stroke="#908d13" stroke-width="0.5" stroke-opacity="0.06"/>
</svg>
